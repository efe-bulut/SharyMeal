{% extends "layout.html" %}

{% block title %}
    Shary Meal | Log in
{% endblock %}

{% block main %}

<div class="auth-wrapper">
  
  <!-- SOL TARAF: LOGO VE FORM -->
  <div class="auth-left">
    <!-- Logo Alanı (static klasöründeki logo.png) -->
    <div>
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="brand-logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='inline-block';">
      <span id="fallback-logo" class="fw-bold fs-5 text-dark" style="display:none;">SharyMeal</span>
      <p class="slogan-font m-0">Welcome back to your table.</p>
    </div>

    <!-- Form İçeriği -->
    <div class="form-container my-auto">
      <h1 class="form-title">Log in</h1>

      <form action="/login" method="POST">
        <div class="mb-3">
          <input 
            type="text" 
            name="name" 
            class="form-control custom-input" 
            placeholder="Username or Email address" 
            required
          >
        </div>

        <div class="mb-3">
          <input 
            type="password" 
            name="password" 
            class="form-control custom-input" 
            placeholder="Password" 
            required
          >
        </div>

        <button type="submit" class="btn btn-custom-login mb-3">
          LOG IN
        </button>
      </form>

      <div class="mt-2">
        <!-- <a href="#" class="text-decoration-none small text-muted d-block mb-2">Forgot password?</a> -->
        <p class="small text-secondary m-0">
          Don't have an account? <a href="/register" class="text-decoration-none fw-bold" style="color: #4fb3d9;">Register here</a>
        </p>
      </div>
    </div>

    <!-- Alt Boşluk Dengeleyicisi -->
    <div></div>
  </div>

  <!-- SAĞ TARAF: GÖRSEL -->
  <div class="auth-right"></div>

</div>
{% endblock %}
