<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="../static/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Google+Sans+Flex:opsz,wght@1..144,1..1000&family=Inconsolata:wdth,wght@106,200..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Monsieur+La+Doulaise&family=Oswald:wght@200..700&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
    /* Chrome, Safari ve Opera için kaydırma çubuğunu gizler */
    ::-webkit-scrollbar {
        display: none;
    }

    /* Firefox için kaydırma çubuğunu gizler */
    body {
        scrollbar-width: none;
    }
</style>

</head>
<body style="margin: 0; padding: 0; width: 100%; overflow-x: hidden; background-color: #dfdfdf; color: #000;">

<nav class="navbar md:navbar-expand fixed top-0 left-0 right-0 z-50 w-full" style="background-color: rgba(18, 18, 18, 0.486); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(72px); border-bottom: 1px solid rgba(218, 218, 218, 0.1);">
  <div style="width: 100%;"class="container-fluid w-full px-6 flex items-center justify-between">
    <a class="navbar-brand" href="#">
        <img src="{{ url_for('static', filename='images/logo-white.png') }}" alt="SharyMeal Logo" style="height: 50px;">
    </a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarLeftDrawer" aria-controls="navbarLeftDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-start" tabindex="-1" id="navbarLeftDrawer" aria-labelledby="navbarLeftDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarLeftDrawerLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body">
        <ul class="navbar-nav me-auto mb-2 md:mb-0" style="display: flex; gap: 2rem; align-items: center;">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="{{url_for('index')}}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{url_for('about')}}">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Explore Meal</a></li>
          <li class="nav-item"><a class="nav-link" href="#">My reservations</a></li>
          <li class="nav-item "><a class="nav-link" href="#"><img class="avatar-img rounded-full " src="../static/images/avatar.png" alt="mdo" width="40" height="40"></a></li>
        </ul>
      </div>
    </dialog>
  </div>
</nav>
    <div style="padding-top: 80px; width: 100%;">
        {% block main %}{% endblock %}
    </div>

<footer class="bg-black/40 backdrop-blur-md text-white py-6 mt-auto border-t border-white/10">
  <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
    <!-- Sol Taraf: Telif veya Marka -->
    <p class="text-sm text-gray-300">&copy; 2026 Shary Meal. All rights reserved. <br>Powered by Efe Bulut</p>
    
    <!-- Sağ Taraf: Linkler veya Sosyal Medya -->
    <div class="flex gap-4 mt-4 md:mt-0 text-sm">
      <a href="#" class="text-gray-300 hover:text-white transition">Privacy Policy</a>
      <a href="#" class="text-gray-300 hover:text-white transition">Terms of Use</a>
      <a href="#" class="text-gray-300 hover:text-white transition">Communication</a>
    </div>
  </div>
</footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
